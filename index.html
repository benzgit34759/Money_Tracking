<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="กระเป๋าเงิน">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>กระเป๋าเงิน</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 id="title">กระเป๋าเงิน</h1>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <button data-view="home"><span class="ic">◎</span>ภาพรวม</button>
    <button data-view="tx"><span class="ic">☰</span>รายการ</button>
    <button class="add" data-act="add" aria-label="เพิ่มรายการ">+</button>
    <button data-view="an"><span class="ic">▥</span>วิเคราะห์</button>
    <button data-view="set"><span class="ic">⚙</span>ตั้งค่า</button>
  </nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <input type="file" id="fileCsv" accept=".csv,text/csv,*/*" hidden>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>

  <script src="app.js"></script>
  <script src="slip-parse.js"></script>
  <script src="slip.js"></script>
</body>
</html>
